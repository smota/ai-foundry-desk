name: Platform validation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: platform-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare canonical Windows temp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force ../afd-ci-temp | Out-Null
      - name: Full project checks
        if: runner.os == 'Windows'
        env:
          TEMP: ${{ github.workspace }}\..\afd-ci-temp
          TMP: ${{ github.workspace }}\..\afd-ci-temp
        run: pnpm check
      - name: Portable project checks
        if: runner.os != 'Windows'
        run: pnpm lint && pnpm typecheck && pnpm build && pnpm docs:check
      - run: node scripts/afd-bootstrap.mjs --help
