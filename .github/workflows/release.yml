name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check -- ${{ github.ref_name }}
      - name: Audit package contents
        shell: pwsh
        run: ./scripts/release-audit.ps1
      - run: pnpm release:build
      - name: Publish release and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem ./release -File | Select-Object -ExpandProperty FullName
          gh release create "${{ github.ref_name }}" $assets `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --generate-notes `
            --title "AI Foundry Desk ${{ github.ref_name }}"
