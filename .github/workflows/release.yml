name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build and audit release artifact
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TEMP: ${{ github.workspace }}\..\afd-ci-temp
      TMP: ${{ github.workspace }}\..\afd-ci-temp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare canonical temp directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force ../afd-ci-temp | Out-Null
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check -- ${{ github.ref_name }}
      - name: Audit package contents
        shell: pwsh
        run: ./scripts/release-audit.ps1
      - run: pnpm check
      - run: pnpm release:build -- --skip-check
      - name: Smoke exact release tarball
        run: node scripts/package-smoke.mjs --tarball release --manager both --host-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: afd-release-${{ github.ref_name }}
          path: release
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: afd-release-${{ github.ref_name }}
          path: release
      - name: Publish release and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Resolve-Path ./release/RELEASE_NOTES.md
          $assets = Get-ChildItem ./release -File | Where-Object Name -ne "RELEASE_NOTES.md" | Select-Object -ExpandProperty FullName
          gh release create "${{ github.ref_name }}" $assets `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --notes-file $notes `
            --title "AI Foundry Desk ${{ github.ref_name }}"

  npm-stage:
    name: Stage exact package on npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: afd-release-${{ github.ref_name }}
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm staged-publishing client
        run: npm install --global npm@11.17.0 --ignore-scripts
      - name: Verify release checksum
        shell: bash
        run: cd release && sha256sum --check ai-foundry-desk-*.tgz.sha256
      - name: Submit package for maintainer review
        run: npm stage publish release/ai-foundry-desk-*.tgz --access public --tag next
